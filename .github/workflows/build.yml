name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit testlar
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Uploat-V.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Uploat-V-apk
          path: Uploat-V.apk

      # main'ga push qilinganda har build alohida release bo'ladi (v1.0.<build raqami>).
      # Ilova ichidagi "Avtomatik yangilash" shu raqamni solishtiradi.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Uploat-V.apk --latest \
            --title "Uploat-V 1.0.${{ github.run_number }}" \
            --notes "Avtomatik build: ${GITHUB_SHA::7}"

  # Emulyatorda to'liq foydalanuvchi yo'li (soxta yuklovchi bilan). APK build'iga xalaqit bermaydi.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Diskda joy ochish
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - name: KVM ni yoqish
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: E2E (emulyator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disk-size: 3072M
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -PtestAbi=x86_64 --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: app/build/reports/androidTests
