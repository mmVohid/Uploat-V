name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release versiyasi (masalan 1.0.0). Bo'sh qoldirilsa, faqat APK yig'iladi"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v1.0.0 tagi yoki qo'lda kiritilgan versiya -> ilova versiyasi 1.0.0 va release.
      # Ikkalasi ham bo'lmasa, build "dev.<raqam>" versiyasi bilan faqat APK beradi.
      - name: Versiyani aniqlash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"
          else V="$INPUT_VERSION"; fi
          [[ -z "$V" || "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versiya noto'g'ri: $V"; exit 1; }
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit testlar
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Uploat-V.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Uploat-V-apk
          path: Uploat-V.apk

      # Release faqat versiya berilganda chiqadi: v* tag push qilinganda yoki Actions -> Run workflow
      # orqali versiya kiritilganda. main'ga oddiy push faqat APK yig'adi (Actions -> Artifacts),
      # shunda foydalanuvchilar sinalmagan o'zgarishlarni emas, oxirgi barqaror versiyani oladi.
      - name: Publish release
        if: ${{ env.VERSION_NAME != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION_NAME"
          # GitHub yuklashda vaqti-vaqti bilan xato beradi (APK katta): 3 marta urinadi
          for i in 1 2 3; do
            if gh release create "$TAG" Uploat-V.apk --latest --target "$GITHUB_SHA" \
                 --title "Uploat-V $VERSION_NAME" \
                 --notes "Barqaror versiya $VERSION_NAME. Commit: ${GITHUB_SHA::7}"; then
              exit 0
            fi
            echo "Urinish $i muvaffaqiyatsiz, qayta urinaman"
            gh release delete "$TAG" --yes || true
            sleep 20
          done
          exit 1
