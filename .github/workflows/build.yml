name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit testlar
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Uploat-V.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Uploat-V-apk
          path: Uploat-V.apk

      # main'ga push: har build alohida release (v1.0.<build raqami>), "latest" belgisi bilan.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Uploat-V.apk --latest \
            --title "Uploat-V 1.0.${{ github.run_number }}" \
            --notes "Avtomatik build: ${GITHUB_SHA::7}"

      # feature/home-settings: bitta "beta" pre-release, har pushda yangilanadi.
      - name: Publish beta
        if: github.ref == 'refs/heads/feature/home-settings' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete beta --cleanup-tag --yes || true
          gh release create beta Uploat-V.apk --prerelease --target "$GITHUB_SHA" \
            --title "Uploat-V beta (build ${{ github.run_number }})" \
            --notes "Sinov versiyasi. Branch: feature/home-settings, commit: ${GITHUB_SHA::7}"
