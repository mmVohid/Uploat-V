name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # v1.0.0 tagi -> ilova versiyasi 1.0.0; tagsiz build'lar "dev.<raqam>" bo'ladi
  VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit testlar
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Uploat-V.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Uploat-V-apk
          path: Uploat-V.apk

      # Release faqat v* tag qo'yilganda chiqadi (masalan: git tag v1.0.1 && git push origin v1.0.1).
      # main'ga oddiy push faqat APK yig'adi: Actions -> Artifacts. Shunda foydalanuvchilar
      # sinalmagan o'zgarishlarni emas, oxirgi barqaror versiyani olaveradi.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # GitHub yuklashda vaqti-vaqti bilan xato beradi (APK katta): 3 marta urinadi
          for i in 1 2 3; do
            if gh release create "$TAG" Uploat-V.apk --latest \
                 --title "Uploat-V ${TAG#v}" \
                 --notes "Barqaror versiya ${TAG#v}. Commit: ${GITHUB_SHA::7}"; then
              exit 0
            fi
            echo "Urinish $i muvaffaqiyatsiz, qayta urinaman"
            gh release delete "$TAG" --yes || true
            sleep 20
          done
          exit 1
