name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Uploat-V.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Uploat-V-apk
          path: Uploat-V.apk

      # main'ga push qilinganda telefon orqali yuklab olish uchun "latest" release yangilanadi
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Uploat-V.apk --prerelease \
            --title "Uploat-V (so'nggi build)" \
            --notes "Avtomatik build: ${GITHUB_SHA::7}"
